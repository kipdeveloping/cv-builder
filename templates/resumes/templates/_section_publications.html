{% load i18n %}
<div class="section">
    <h2 class="section-title">{% trans "Publicaciones" %}</h2>
    <div id="publications-list">
        {% for pub in resume.content.publications %}
        <div class="entry" data-section="publications" data-index="{{ forloop.counter0 }}">
            <div class="entry-title" contenteditable="true" data-field="title">{{ pub.title }}</div>
            <div class="entry-subtitle" contenteditable="true" data-field="venue">{{ pub.venue }}</div>
            <div class="entry-period" contenteditable="true" data-field="year">{{ pub.year }}</div>
            <div class="entry-description" contenteditable="true" data-field="url">{{ pub.url }}</div>
        </div>
        {% empty %}
        <div class="entry" data-section="publications" data-index="0">
            <div class="entry-title" contenteditable="true" data-field="title">{% trans "Título de la publicación" %}</div>
            <div class="entry-subtitle" contenteditable="true" data-field="venue">{% trans "Medio o revista" %}</div>
            <div class="entry-period" contenteditable="true" data-field="year">{% trans "Año" %}</div>
            <div class="entry-description" contenteditable="true" data-field="url">{% trans "https://..." %}</div>
        </div>
        {% endfor %}
    </div>
    <button class="add-entry-btn mt-2 text-sm text-indigo-600 hover:text-indigo-700" data-section="publications">
        + {% trans "Agregar publicación" %}
    </button>
</div>
