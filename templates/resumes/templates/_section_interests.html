{% load i18n %}
<div class="section">
    <h2 class="section-title">{% trans "Intereses" %}</h2>
    <div id="interests-list" class="skills-list">
        {% for interest in resume.content.interests %}
        <span class="skill-tag" contenteditable="true" data-field="interest" data-index="{{ forloop.counter0 }}">{{ interest }}</span>
        {% empty %}
        <span class="skill-tag" contenteditable="true" data-field="interest" data-index="0">{% trans "Viajar" %}</span>
        <span class="skill-tag" contenteditable="true" data-field="interest" data-index="1">{% trans "Lectura" %}</span>
        {% endfor %}
    </div>
    <button id="add-interest-btn" class="mt-2 text-sm text-indigo-600 hover:text-indigo-700">
        + {% trans "Agregar interés" %}
    </button>
</div>
