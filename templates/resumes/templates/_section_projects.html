{% load i18n %}
<div class="section">
    <h2 class="section-title">{% trans "Proyectos" %}</h2>
    <div id="projects-list">
        {% for proj in resume.content.projects %}
        <div class="entry" data-section="projects" data-index="{{ forloop.counter0 }}">
            <div class="entry-title" contenteditable="true" data-field="title">{{ proj.title }}</div>
            <div class="entry-description" contenteditable="true" data-field="description">{{ proj.description }}</div>
            <div class="entry-period" contenteditable="true" data-field="link">{{ proj.link }}</div>
        </div>
        {% empty %}
        <div class="entry" data-section="projects" data-index="0">
            <div class="entry-title" contenteditable="true" data-field="title">{% trans "Nombre del proyecto" %}</div>
            <div class="entry-description" contenteditable="true" data-field="description">{% trans "Descripción del proyecto..." %}</div>
            <div class="entry-period" contenteditable="true" data-field="link">{% trans "https://..." %}</div>
        </div>
        {% endfor %}
    </div>
    <button class="add-entry-btn mt-2 text-sm text-indigo-600 hover:text-indigo-700" data-section="projects">
        + {% trans "Agregar proyecto" %}
    </button>
</div>
