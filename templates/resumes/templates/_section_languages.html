{% load i18n %}
<div class="section">
    <h2 class="section-title">{% trans "Idiomas" %}</h2>
    <div id="languages-list">
        {% for lang in resume.content.languages %}
        <div class="entry" data-section="languages" data-index="{{ forloop.counter0 }}">
            <div class="entry-title" contenteditable="true" data-field="language">{{ lang.language }}</div>
            <div class="entry-subtitle" contenteditable="true" data-field="level">{{ lang.level }}</div>
        </div>
        {% empty %}
        <div class="entry" data-section="languages" data-index="0">
            <div class="entry-title" contenteditable="true" data-field="language">{% trans "Idioma" %}</div>
            <div class="entry-subtitle" contenteditable="true" data-field="level">{% trans "Nivel" %}</div>
        </div>
        {% endfor %}
    </div>
    <button class="add-entry-btn mt-2 text-sm text-indigo-600 hover:text-indigo-700" data-section="languages">
        + {% trans "Agregar idioma" %}
    </button>
</div>
