{% load i18n %}
<div class="section">
    <h2 class="section-title">{% trans "Certificaciones y Cursos" %}</h2>
    <div id="certifications-list">
        {% for cert in resume.content.certifications %}
        <div class="entry" data-section="certifications" data-index="{{ forloop.counter0 }}">
            <div class="entry-title" contenteditable="true" data-field="name">{{ cert.name }}</div>
            <div class="entry-subtitle" contenteditable="true" data-field="institution">{{ cert.institution }}</div>
            <div class="entry-period" contenteditable="true" data-field="year">{{ cert.year }}</div>
        </div>
        {% empty %}
        <div class="entry" data-section="certifications" data-index="0">
            <div class="entry-title" contenteditable="true" data-field="name">{% trans "Nombre de la certificación" %}</div>
            <div class="entry-subtitle" contenteditable="true" data-field="institution">{% trans "Institución o plataforma" %}</div>
            <div class="entry-period" contenteditable="true" data-field="year">{% trans "Año" %}</div>
        </div>
        {% endfor %}
    </div>
    <button class="add-entry-btn mt-2 text-sm text-indigo-600 hover:text-indigo-700" data-section="certifications">
        + {% trans "Agregar certificación" %}
    </button>
</div>
