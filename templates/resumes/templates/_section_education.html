{% load i18n %}
<div class="section">
    <h2 class="section-title">{% trans "Educación" %}</h2>
    <div id="education-list">
        {% for edu in resume.content.education %}
        <div class="entry" data-section="education" data-index="{{ forloop.counter0 }}">
            <div class="entry-title" contenteditable="true" data-field="degree">{{ edu.degree }}</div>
            <div class="entry-subtitle" contenteditable="true" data-field="school">{{ edu.school }}</div>
            <div class="entry-period" contenteditable="true" data-field="year">{{ edu.year }}</div>
        </div>
        {% empty %}
        <div class="entry" data-section="education" data-index="0">
            <div class="entry-title" contenteditable="true" data-field="degree">{% trans "Título" %}</div>
            <div class="entry-subtitle" contenteditable="true" data-field="school">{% trans "Institución" %}</div>
            <div class="entry-period" contenteditable="true" data-field="year">{% trans "2018" %}</div>
        </div>
        {% endfor %}
    </div>
    <button class="add-entry-btn mt-2 text-sm text-indigo-600 hover:text-indigo-700" data-section="education">
        + {% trans "Agregar educación" %}
    </button>
</div>
