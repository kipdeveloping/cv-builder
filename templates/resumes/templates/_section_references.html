{% load i18n %}
<div class="section">
    <h2 class="section-title">{% trans "Referencias" %}</h2>
    <div id="references-list">
        {% for ref in resume.content.references %}
        <div class="entry" data-section="references" data-index="{{ forloop.counter0 }}">
            <div class="entry-title" contenteditable="true" data-field="name">{{ ref.name }}</div>
            <div class="entry-subtitle" contenteditable="true" data-field="position">{{ ref.position }}</div>
            <div class="entry-period" contenteditable="true" data-field="company">{{ ref.company }}</div>
            <div class="entry-description" contenteditable="true" data-field="contact">{{ ref.contact }}</div>
        </div>
        {% empty %}
        <div class="entry" data-section="references" data-index="0">
            <div class="entry-title" contenteditable="true" data-field="name">{% trans "Nombre" %}</div>
            <div class="entry-subtitle" contenteditable="true" data-field="position">{% trans "Cargo" %}</div>
            <div class="entry-period" contenteditable="true" data-field="company">{% trans "Empresa" %}</div>
            <div class="entry-description" contenteditable="true" data-field="contact">{% trans "email o teléfono" %}</div>
        </div>
        {% endfor %}
    </div>
    <button class="add-entry-btn mt-2 text-sm text-indigo-600 hover:text-indigo-700" data-section="references">
        + {% trans "Agregar referencia" %}
    </button>
</div>
