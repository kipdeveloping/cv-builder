{% load i18n %}
<div class="section">
    <h2 class="section-title">{% trans "Habilidades" %}</h2>
    <div id="skills-list" class="skills-list">
        {% for skill in resume.content.skills %}
        <span class="skill-tag" contenteditable="true" data-field="skill" data-index="{{ forloop.counter0 }}">{{ skill }}</span>
        {% empty %}
        <span class="skill-tag" contenteditable="true" data-field="skill" data-index="0">{% trans "Python" %}</span>
        <span class="skill-tag" contenteditable="true" data-field="skill" data-index="1">{% trans "JavaScript" %}</span>
        {% endfor %}
    </div>
    <button id="add-skill-btn" class="mt-2 text-sm text-indigo-600 hover:text-indigo-700">
        + {% trans "Agregar habilidad" %}
    </button>
</div>
